name: Sync site files for GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'AI-Tools-Directory/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync website files
        run: |
          mkdir -p docs
          cp -R AI-Tools-Directory/. docs/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'Pages files already up to date'
            exit 0
          fi
          git commit -m 'Sync website files for GitHub Pages'
          git push